input {
  # Ingest logs directly from log file
  file {
    path => "/usr/share/logstash/pipeline/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "spring-boot-logs"
  }
  # Also listen on TCP for direct streaming
  tcp {
    port => 5000
    codec => json_lines
    type => "tcp-logs"
  }
}

filter {
  if [type] == "spring-boot-logs" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} \[%{DATA:thread}\] %{LOGLEVEL:log_level} %{DATA:logger} \[app=%{DATA:app_name}\] - %{GREEDYDATA:log_message}" }
    }
    date {
      match => [ "log_timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "placement-portal-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
