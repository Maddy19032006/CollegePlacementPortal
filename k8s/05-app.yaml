apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-app
  namespace: placement-portal
  labels:
    app: placement-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placement-app
  template:
    metadata:
      labels:
        app: placement-app
    spec:
      containers:
        - name: app
          image: placement-portal:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: placement-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: placement-secrets
                  key: DB_PASSWORD
            - name: DEMO_PASSWORD_STUDENT
              valueFrom:
                secretKeyRef:
                  name: placement-secrets
                  key: DEMO_PASSWORD_STUDENT
            - name: DEMO_PASSWORD_OFFICER
              valueFrom:
                secretKeyRef:
                  name: placement-secrets
                  key: DEMO_PASSWORD_OFFICER
            - name: DEMO_PASSWORD_ADMIN
              valueFrom:
                secretKeyRef:
                  name: placement-secrets
                  key: DEMO_PASSWORD_ADMIN
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /login.html
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login.html
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: placement-app-service
  namespace: placement-portal
  labels:
    app: placement-app
spec:
  type: NodePort
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
      protocol: TCP
      name: http
  selector:
    app: placement-app
