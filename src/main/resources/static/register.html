<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register · College Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="auth-shell">
<div>
    <div class="card auth-card">
        <div class="card-body p-4">
            <div class="text-center"><span class="auth-brand">P</span></div>
            <h1 class="auth-title text-center mb-1">Start your journey</h1>
            <p class="text-center text-muted mb-4">Create your account in under a minute.</p>
            <ul class="nav nav-pills nav-justified mb-4" id="roleTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="student-tab" data-bs-toggle="pill" data-role="STUDENT" type="button" role="tab" aria-selected="true">Student</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="officer-tab" data-bs-toggle="pill" data-role="PLACEMENT_OFFICER" type="button" role="tab" aria-selected="false">Officer</button>
                </li>
            </ul>
            <div id="alert-placeholder"></div>
            <form id="register-form">
                <div class="mb-3">
                    <label class="form-label" for="fullName">Full name</label>
                    <input class="form-control" id="fullName" required maxlength="100">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" required minlength="4" maxlength="50"
                           pattern="[a-zA-Z0-9._\-]+" title="Letters, digits, dot, underscore, hyphen">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" type="email" required>
                </div>
                <div id="student-fields">
                    <div class="mb-3">
                        <label class="form-label" for="studentId">Roll Number / Student ID</label>
                        <input class="form-control" id="studentId" maxlength="50" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="studentDepartment">Department / Branch</label>
                        <input class="form-control" id="studentDepartment" maxlength="100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="degree">Degree (e.g., B.Tech, MCA)</label>
                        <input class="form-control" id="degree" maxlength="100" required>
                    </div>
                </div>
                <div id="officer-fields" class="d-none">
                    <div class="mb-3">
                        <label class="form-label" for="companyName">Company Name</label>
                        <input class="form-control" id="companyName" maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="designation">Designation</label>
                        <input class="form-control" id="designation" maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="employeeId">Employee ID</label>
                        <input class="form-control" id="employeeId" maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="department">Department</label>
                        <input class="form-control" id="department" maxlength="100">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <input class="form-control" id="password" type="password" required minlength="8"
                               title="At least 8 chars with upper, lower, digit and special character">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="form-text">Min 8 chars, with upper &amp; lower case, a digit and a special character.</div>
                </div>
                <button class="btn btn-primary w-100" type="submit">Create PlacePilot account</button>
            </form>
            <p class="text-center mt-3 mb-0">Already registered? <a href="/login.html">Login</a></p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    if (togglePassword && password) {
        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.querySelector('i').classList.toggle('bi-eye');
            this.querySelector('i').classList.toggle('bi-eye-slash');
        });
    }

    document.querySelectorAll('#roleTabs .nav-link').forEach(tab => {
        tab.addEventListener('shown.bs.tab', event => {
            const role = event.target.getAttribute('data-role');
            const officerFields = document.getElementById('officer-fields');
            const studentFields = document.getElementById('student-fields');
            if (role === 'PLACEMENT_OFFICER') {
                officerFields.classList.remove('d-none');
                studentFields.classList.add('d-none');
                document.getElementById('companyName').required = true;
                document.getElementById('designation').required = true;
                document.getElementById('employeeId').required = true;
                document.getElementById('department').required = true;
                
                document.getElementById('studentId').required = false;
                document.getElementById('studentDepartment').required = false;
                document.getElementById('degree').required = false;
            } else {
                officerFields.classList.add('d-none');
                studentFields.classList.remove('d-none');
                document.getElementById('companyName').required = false;
                document.getElementById('designation').required = false;
                document.getElementById('employeeId').required = false;
                document.getElementById('department').required = false;
                
                document.getElementById('studentId').required = true;
                document.getElementById('studentDepartment').required = true;
                document.getElementById('degree').required = true;
            }
        });
    });
</script>
<script>
document.getElementById('register-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    clearAlert();
    try {
        const activeTab = document.querySelector('#roleTabs .nav-link.active');
        const role = activeTab ? activeTab.getAttribute('data-role') : 'STUDENT';
        const bodyParams = {
            username: document.getElementById('username').value.trim(),
            email: document.getElementById('email').value.trim(),
            fullName: document.getElementById('fullName').value.trim(),
            password: document.getElementById('password').value,
            role: role,
        };
        if (role === 'PLACEMENT_OFFICER') {
            bodyParams.companyName = document.getElementById('companyName').value.trim();
            bodyParams.designation = document.getElementById('designation').value.trim();
            bodyParams.employeeId = document.getElementById('employeeId').value.trim();
            bodyParams.department = document.getElementById('department').value.trim();
        } else if (role === 'STUDENT') {
            bodyParams.studentId = document.getElementById('studentId').value.trim();
            bodyParams.department = document.getElementById('studentDepartment').value.trim();
            bodyParams.degree = document.getElementById('degree').value.trim();
        }

        await api('/auth/register', {
            method: 'POST',
            body: JSON.stringify(bodyParams),
        });
        showAlert('Registration successful! Please login.', 'success');
        setTimeout(() => window.location.href = '/login.html', 1200);
    } catch (error) {
        showAlert(error.message);
    }
});
</script>
</body>
</html>
