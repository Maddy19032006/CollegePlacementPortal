<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · College Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="auth-shell">
<div>
    <div class="card auth-card">
        <div class="card-body p-4">
            <div class="text-center"><span class="auth-brand">P</span></div>
            <h1 class="auth-title text-center mb-1">Welcome back</h1>
            <p class="text-center text-muted mb-4">Sign in to continue your placement journey.</p>
            <ul class="nav nav-pills nav-justified mb-4" id="roleTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="student-tab" data-bs-toggle="pill" data-role="STUDENT" type="button" role="tab" aria-selected="true">Student</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="officer-tab" data-bs-toggle="pill" data-role="PLACEMENT_OFFICER" type="button" role="tab" aria-selected="false">Officer</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="admin-tab" data-bs-toggle="pill" data-role="ADMIN" type="button" role="tab" aria-selected="false">Admin</button>
                </li>
            </ul>
            <div id="alert-placeholder"></div>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <input class="form-control" id="password" name="password" type="password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button class="btn btn-primary w-100" type="submit">Sign in to PlacePilot</button>
            </form>
            <p class="text-center mt-3 mb-0">
                New student? <a href="/register.html">Create an account</a>
            </p>
            <hr>
            <details>
                <summary class="text-muted small">Demo credentials</summary>
                <ul class="small text-muted mt-2 mb-0">
                    <li>Student: <code>arjun</code> / <code>demoStudent@123</code></li>
                    <li>Officer: <code>officer</code> / <code>demoOfficer@123</code></li>
                    <li>Admin: <code>admin</code> / <code>demoAdmin@123</code></li>
                </ul>
            </details>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    if (togglePassword && password) {
        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.querySelector('i').classList.toggle('bi-eye');
            this.querySelector('i').classList.toggle('bi-eye-slash');
        });
    }
</script>
<script>
document.getElementById('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    clearAlert();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    
    // Get the active role tab
    const activeTab = document.querySelector('#roleTabs .nav-link.active');
    const role = activeTab ? activeTab.getAttribute('data-role') : 'STUDENT';
    
    try {
        const user = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ username, password, role }),
        });
        if (user.role === 'STUDENT') window.location.href = '/student-dashboard.html';
        else if (user.role === 'PLACEMENT_OFFICER') window.location.href = '/officer-dashboard.html';
        else window.location.href = '/admin-reports.html';
    } catch (error) {
        showAlert(error.message);
    }
});
</script>
</body>
</html>
