<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports · Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alert-placeholder"></div>
    <div class="page-kicker">System administration</div>
    <h1 class="page-heading">Placement analytics</h1>
    <p class="page-subtitle">Understand the health of your placement process at a glance.</p>

    <div class="row g-4 mb-4" id="stat-cards"></div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card"><div class="card-body">
                <h5>Applications by status</h5>
                <div id="status-stats"></div>
            </div></div>
        </div>
        <div class="col-md-6">
            <div class="card"><div class="card-body">
                <h5>Students by department</h5>
                <div id="department-stats"></div>
            </div></div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
    const user = await requireAuth();
    requireRole(user, 'ADMIN');
    document.getElementById('navbar').innerHTML = navbar('admin-reports');
    try {
        const stats = await api('/admin/stats');
        const cards = [
            ['Total users', stats.totalUsers],
            ['Students', stats.totalStudents],
            ['Officers', stats.totalOfficers],
            ['Companies', stats.totalCompanies],
            ['Applications', stats.totalApplications],
            ['Selected', stats.selectedCount],
        ];
        document.getElementById('stat-cards').innerHTML = cards.map(([label, value]) => `
            <div class="col-md-2 col-6"><div class="card stat-card"><div class="card-body">
                <div class="stat-label">${escapeHtml(label)}</div><div class="stat-value">${escapeHtml(value)}</div>
            </div></div></div>`).join('');

        document.getElementById('status-stats').innerHTML = Object.entries(stats.applicationsByStatus)
            .map(([status, count]) => `
                <div class="d-flex justify-content-between border-bottom py-2">
                    <span>${escapeHtml(status).replaceAll('_', ' ')}</span><strong>${escapeHtml(count)}</strong>
                </div>`).join('');

        document.getElementById('department-stats').innerHTML = stats.studentsByDepartment.length
            ? stats.studentsByDepartment.map(d => `
                <div class="d-flex justify-content-between border-bottom py-2">
                    <span>${escapeHtml(d.department)}</span><strong>${escapeHtml(d.students)}</strong>
                </div>`).join('')
            : '<p class="text-muted">No students registered yet.</p>';
    } catch (error) {
        showAlert(error.message);
    }
})();
</script>
</body>
</html>
