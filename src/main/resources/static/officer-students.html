<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students · Officer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alert-placeholder"></div>
    <div class="page-kicker">Student directory</div>
    <h1 class="page-heading">Registered students</h1>
    <p class="page-subtitle">Review placement-ready profiles across your student community.</p>

    <div class="card"><div class="card-body">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead><tr>
                    <th>Name</th><th>Reg. No</th><th>Department</th><th>Program</th>
                    <th>Grad Year</th><th>CGPA</th><th>Skills</th>
                </tr></thead>
                <tbody id="students-body"><tr><td colspan="7" class="text-muted">Loading...</td></tr></tbody>
            </table>
        </div>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
    const user = await requireAuth();
    requireRole(user, 'PLACEMENT_OFFICER', 'ADMIN');
    document.getElementById('navbar').innerHTML = navbar('officer-students');
    try {
        const students = await api('/officer/students');
        document.getElementById('students-body').innerHTML = students.map(s => `
            <tr>
                <td>${escapeHtml(s.fullName)}</td><td>${escapeHtml(s.registrationNumber)}</td><td>${escapeHtml(s.department)}</td>
                <td>${escapeHtml(s.program)}</td><td>${escapeHtml(s.graduationYear)}</td><td>${escapeHtml(s.cgpa)}</td>
                <td>${(s.skills || []).map(skill => `<span class="skill-chip">${escapeHtml(skill)}</span>`).join(' ')}</td>
            </tr>`).join('');
    } catch (error) {
        showAlert(error.message);
    }
})();
</script>
</body>
</html>
