<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Companies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alert-placeholder"></div>
    <div class="page-kicker">Opportunity board</div>
    <h1 class="page-heading">Find a role that fits you.</h1>
    <p class="page-subtitle">Explore active campus opportunities, compare requirements and apply with clarity.</p>

    <div class="card mb-4"><div class="card-body">
        <form id="search-form" class="row g-2 align-items-end">
            <div class="col-md-5">
                <label class="form-label">Search by name</label>
                <input class="form-control" id="search-name" placeholder="e.g. Infotech">
            </div>
            <div class="col-md-4">
                <label class="form-label">Filter by department</label>
                <select class="form-select" id="search-department">
                    <option value="">All departments</option>
                    <option>CSE</option><option>IT</option><option>ECE</option>
                    <option>EEE</option><option>MECH</option><option>CIVIL</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary w-100" type="submit">Search</button>
            </div>
        </form>
    </div></div>

    <div class="row g-4" id="company-list"></div>
</div>

<!-- Eligibility / details modal -->
<div class="modal fade" id="company-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">Company</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modal-body">Loading...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
let currentUserRole = null;

function companyCard(company) {
    const deadlineSoon = new Date(`${company.applicationDeadline}T23:59:59`) - Date.now() < 7 * 24 * 3600 * 1000;
    const skills = (company.requiredSkills || '').split(',').map(s => s.trim()).filter(Boolean).slice(0, 3);
    return `
    <div class="col-md-6 col-lg-4">
        <div class="card opportunity-card h-100"><div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-3"><span class="company-initial">${escapeHtml(company.name).charAt(0)}</span><span class="package-chip">${escapeHtml(company.packageCtc ?? '—')} LPA</span></div>
            <h5 class="mb-1">${escapeHtml(company.name)}</h5>
            <p class="text-muted mb-3">${escapeHtml(company.jobRole)}</p>
            <div class="mb-3">${skills.length ? skills.map(skill => `<span class="skill-chip">${escapeHtml(skill)}</span>`).join('') : '<span class="text-muted small">Open to diverse skill profiles</span>'}</div>
            <div class="mt-auto d-flex justify-content-between align-items-center gap-2"><span class="${deadlineSoon ? 'deadline-chip' : 'text-muted small fw-semibold'}">Deadline ${formatDate(company.applicationDeadline)}</span><button class="btn btn-primary btn-sm" onclick="showCompany(${company.id})">View role</button></div>
        </div></div>
    </div>`;
}

async function showCompany(id) {
    clearAlert();
    try {
        const company = await api(`/companies/${id}`);
        document.getElementById('modal-title').textContent = `${company.name} — ${company.jobRole}`;
        let html = `
            <p>${escapeHtml(company.description || 'No additional description provided.')}</p>
            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item"><strong>Package:</strong> ${escapeHtml(company.packageCtc ?? '-')} LPA</li>
                <li class="list-group-item"><strong>Min CGPA:</strong> ${escapeHtml(company.minCgpa)}</li>
                <li class="list-group-item"><strong>Eligible departments:</strong> ${escapeHtml(company.requiredDepartments || 'All departments')}</li>
                <li class="list-group-item"><strong>Required skills:</strong> ${escapeHtml(company.requiredSkills || 'No specific skills')}</li>
                <li class="list-group-item"><strong>Min graduation year:</strong> ${escapeHtml(company.minGraduationYear ?? '-')}</li>
                <li class="list-group-item"><strong>Deadline:</strong> ${formatDate(company.applicationDeadline)}</li>
            </ul>`;

        if (currentUserRole === 'STUDENT') {
            html += `
            <div id="eligibility-result"></div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary" onclick="checkEligibility(${id})">Check my eligibility</button>
                <button class="btn btn-primary" onclick="applyToCompany(${id})">Apply now</button>
            </div>`;
        }
        document.getElementById('modal-body').innerHTML = html;
        new bootstrap.Modal(document.getElementById('company-modal')).show();
    } catch (error) {
        showAlert(error.message);
    }
}

async function checkEligibility(id) {
    const result = document.getElementById('eligibility-result');
    result.innerHTML = '<div class="alert alert-info">Checking your profile against this role...</div>';
    try {
        const eligibility = await api(`/students/companies/${id}/eligibility`);
        result.innerHTML = eligibility.eligible
            ? '<div class="alert alert-success"><strong>You are eligible.</strong> Your current profile meets every requirement for this role.</div>'
            : `<div class="alert alert-warning"><strong>Not eligible yet.</strong><ul class="mb-0 mt-2">${eligibility.failedCriteria.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul></div>`;
    } catch (error) {
        result.innerHTML = `<div class="alert alert-danger">${escapeHtml(error.message)}</div>`;
    }
}

async function applyToCompany(id) {
    try {
        await api(`/applications?companyId=${id}`, { method: 'POST' });
        bootstrap.Modal.getInstance(document.getElementById('company-modal')).hide();
        showAlert('Application submitted successfully!', 'success');
    } catch (error) {
        document.getElementById('eligibility-result').innerHTML =
            `<div class="alert alert-danger">${escapeHtml(error.message)}</div>`;
    }
}

(async function () {
    const user = await requireAuth();
    currentUserRole = user.role;
    document.getElementById('navbar').innerHTML = navbar(user.role === 'STUDENT' ? 'companies' : 'officer-dashboard');
    loadCompanies();
    document.getElementById('search-form').addEventListener('submit', (event) => {
        event.preventDefault();
        loadCompanies();
    });
})();

async function loadCompanies() {
    const name = document.getElementById('search-name').value.trim();
    const department = document.getElementById('search-department').value;
    const query = new URLSearchParams();
    if (name) query.set('name', name);
    if (department) query.set('department', department);
    try {
        const companies = await api(`/companies?${query.toString()}`);
        document.getElementById('company-list').innerHTML = companies.length
            ? companies.map(companyCard).join('')
            : '<p class="text-muted">No companies match your search.</p>';
    } catch (error) {
        showAlert(error.message);
    }
}
</script>
</body>
</html>
