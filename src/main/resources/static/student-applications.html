<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Applications · Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alert-placeholder"></div>
    <div class="page-kicker">Application tracker</div>
    <h1 class="page-heading">Every application, one clear view.</h1>
    <p class="page-subtitle">Follow your progress from application to final decision.</p>

    <div class="card"><div class="card-body">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead><tr>
                    <th>Company</th><th>Role</th><th>Status</th><th>Applied on</th><th></th>
                </tr></thead>
                <tbody id="applications-body">
                    <tr><td colspan="5" class="text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
    const user = await requireAuth();
    requireRole(user, 'STUDENT');
    document.getElementById('navbar').innerHTML = navbar('student-applications');
    loadApplications();
})();

async function loadApplications() {
    try {
        const applications = await api('/students/applications');
        document.getElementById('applications-body').innerHTML = applications.length
            ? applications.map(a => `
                <tr>
                    <td>${escapeHtml(a.companyName)}</td>
                    <td>${escapeHtml(a.jobRole)}</td>
                    <td>${statusBadge(a.status)}</td>
                    <td>${formatDate(a.appliedAt)}</td>
                    <td>${a.status === 'APPLIED'
                        ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelApplication(${a.id})">Cancel</button>`
                        : ''}</td>
                </tr>`).join('')
            : '<tr><td colspan="5" class="text-muted">No applications yet. <a href="/companies.html">Browse companies</a></td></tr>';
    } catch (error) {
        showAlert(error.message);
    }
}

async function cancelApplication(id) {
    if (!confirm('Cancel this application?')) return;
    try {
        await api(`/students/applications/${id}`, { method: 'DELETE' });
        showAlert('Application cancelled.', 'success');
        loadApplications();
    } catch (error) {
        showAlert(error.message);
    }
}
</script>
</body>
</html>
