<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preparation · Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alert-placeholder"></div>
    <div class="page-kicker">Preparation centre</div>
    <h1 class="page-heading">Build your readiness, one skill at a time.</h1>
    <p class="page-subtitle">Update your self-assessment and see where to focus next.</p>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card"><div class="card-body">
                <h5>Enter your scores</h5>
                <form id="preparation-form">
                    <div class="mb-3">
                        <label class="form-label">Aptitude (weight 20%)</label>
                        <input class="form-control" id="aptitude" type="number" min="0" max="100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Coding (weight 30%)</label>
                        <input class="form-control" id="coding" type="number" min="0" max="100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Technical (weight 20%)</label>
                        <input class="form-control" id="technical" type="number" min="0" max="100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Projects (weight 20%)</label>
                        <input class="form-control" id="projects" type="number" min="0" max="100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Communication (weight 10%)</label>
                        <input class="form-control" id="communication" type="number" min="0" max="100" required>
                    </div>
                    <button class="btn btn-primary" type="submit">Save scores</button>
                </form>
            </div></div>
        </div>
        <div class="col-lg-7">
            <div class="card mb-4"><div class="card-body text-center">
                <h5>Placement readiness score</h5>
                <h1 class="display-3 text-primary" id="readiness-score">-</h1>
                <div class="progress"><div id="readiness-bar" class="progress-bar bg-success" style="width:0%"></div></div>
                <p class="text-muted mt-2 mb-0">aptitude×0.20 + coding×0.30 + technical×0.20 + projects×0.20 + communication×0.10</p>
            </div></div>
            <div class="card"><div class="card-body">
                <h5>Component breakdown</h5>
                <div id="component-bars"></div>
            </div></div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
function renderComponents(prep) {
    const rows = [
        ['Aptitude', prep.aptitude, '20%'],
        ['Coding', prep.coding, '30%'],
        ['Technical', prep.technical, '20%'],
        ['Projects', prep.projects, '20%'],
        ['Communication', prep.communication, '10%'],
    ];
    document.getElementById('component-bars').innerHTML = rows.map(([label, value, weight]) => `
        <div class="mb-3">
            <div class="d-flex justify-content-between">
                <span>${label} <small class="text-muted">(${weight})</small></span>
                <strong>${value}/100</strong>
            </div>
            <div class="progress">
                <div class="progress-bar ${value >= 60 ? 'bg-success' : value >= 40 ? 'bg-warning' : 'bg-danger'}"
                     style="width:${value}%"></div>
            </div>
        </div>`).join('');
}

(async function () {
    const user = await requireAuth();
    requireRole(user, 'STUDENT');
    document.getElementById('navbar').innerHTML = navbar('student-preparation');

    try {
        const prep = await api('/students/preparation');
        for (const field of ['aptitude', 'coding', 'technical', 'projects', 'communication']) {
            document.getElementById(field).value = prep[field];
        }
        document.getElementById('readiness-score').textContent = prep.readinessScore.toFixed(1);
        document.getElementById('readiness-bar').style.width = prep.readinessScore + '%';
        renderComponents(prep);
    } catch (error) {
        showAlert(error.message);
    }

    document.getElementById('preparation-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearAlert();
        try {
            const prep = await api('/students/preparation', {
                method: 'PUT',
                body: JSON.stringify({
                    aptitude: +document.getElementById('aptitude').value,
                    coding: +document.getElementById('coding').value,
                    technical: +document.getElementById('technical').value,
                    projects: +document.getElementById('projects').value,
                    communication: +document.getElementById('communication').value,
                }),
            });
            document.getElementById('readiness-score').textContent = prep.readinessScore.toFixed(1);
            document.getElementById('readiness-bar').style.width = prep.readinessScore + '%';
            renderComponents(prep);
            showAlert('Scores saved!', 'success');
        } catch (error) {
            showAlert(error.message);
        }
    });
})();
</script>
</body>
</html>
