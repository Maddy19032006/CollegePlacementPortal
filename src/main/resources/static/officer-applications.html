<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Applications · Officer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container">
    <div id="alert-placeholder"></div>
    <div class="page-kicker">Candidate pipeline</div>
    <h1 class="page-heading">Applications</h1>
    <p class="page-subtitle">Move candidates through a consistent and transparent hiring process.</p>

    <div class="card mb-4"><div class="card-body">
        <label class="form-label">Filter by status</label>
        <select class="form-select" id="status-filter" style="max-width: 300px">
            <option value="">All statuses</option>
            <option>APPLIED</option><option>SHORTLISTED</option><option>ONLINE_TEST</option>
            <option>TECHNICAL_INTERVIEW</option><option>HR_INTERVIEW</option>
            <option>SELECTED</option><option>REJECTED</option>
        </select>
    </div></div>

    <div class="card"><div class="card-body">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead><tr>
                    <th>Student</th><th>Reg. No</th><th>Department</th><th>CGPA</th>
                    <th>Company</th><th>Status</th><th>Change status</th>
                </tr></thead>
                <tbody id="applications-body"><tr><td colspan="7" class="text-muted">Loading...</td></tr></tbody>
            </table>
        </div>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
const STATUSES = ['SHORTLISTED', 'ONLINE_TEST', 'TECHNICAL_INTERVIEW', 'HR_INTERVIEW', 'SELECTED', 'REJECTED'];

(async function () {
    const user = await requireAuth();
    requireRole(user, 'PLACEMENT_OFFICER', 'ADMIN');
    document.getElementById('navbar').innerHTML = navbar('officer-applications');
    loadApplications();
    document.getElementById('status-filter').addEventListener('change', loadApplications);
})();

async function loadApplications() {
    const status = document.getElementById('status-filter').value;
    const query = status ? `?status=${status}` : '';
    try {
        const applications = await api(`/applications${query}`);
        document.getElementById('applications-body').innerHTML = applications.length
            ? applications.map(a => `
                <tr>
                    <td>${escapeHtml(a.studentName)}</td><td>${escapeHtml(a.registrationNumber)}</td>
                    <td>${escapeHtml(a.department)}</td><td>${escapeHtml(a.cgpa)}</td>
                    <td>${escapeHtml(a.companyName)}</td>
                    <td>${statusBadge(a.status)}</td>
                    <td>
                        <select class="form-select form-select-sm" style="min-width: 190px"
                                onchange="updateStatus(${a.id}, this.value)">
                            <option value="">Change to...</option>
                            ${STATUSES.map(s => `<option value="${s}">${s.replaceAll('_', ' ')}</option>`).join('')}
                        </select>
                    </td>
                </tr>`).join('')
            : '<tr><td colspan="7" class="text-muted">No applications found.</td></tr>';
    } catch (error) {
        showAlert(error.message);
    }
}

async function updateStatus(id, status) {
    if (!status) return;
    try {
        await api(`/applications/${id}/status`, { method: 'PUT', body: JSON.stringify({ status }) });
        showAlert('Status updated.', 'success');
        loadApplications();
    } catch (error) {
        showAlert(error.message);
        loadApplications();
    }
}
</script>
</body>
</html>
