spring.application.name=placement-portal

# ---------- Database ----------
# Defaults suit a local MySQL install; override with environment variables or .env
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:placement_portal}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA ----------
# update: tables are created/updated automatically on startup (fine for local dev)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Server ----------
server.port=${SERVER_PORT:8081}

# ---------- Demo data seeding ----------
# Passwords for the seeded demo accounts are provided via the environment so
# no real credentials live in source code. See .env.example and README.
app.demo-passwords.student=${DEMO_PASSWORD_STUDENT:demoStudent@123}
app.demo-passwords.officer=${DEMO_PASSWORD_OFFICER:demoOfficer@123}
app.demo-passwords.admin=${DEMO_PASSWORD_ADMIN:demoAdmin@123}

# ---------- Logging ----------
logging.level.org.hibernate.SQL=INFO
